name: Python and PostgreSQL tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: COT
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: CI_only_admin_password_12345!
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d COT"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COT_TEST_DSN: postgresql://postgres:CI_only_admin_password_12345!@localhost:5432/COT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q cot_ingest tests scripts
      - run: python -m unittest discover -s tests -v
